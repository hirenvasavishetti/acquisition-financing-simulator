[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acquisition-financing-simulator"
version = "0.3.0"
description = "Reproducible acquisition financing, liquidity and debt capacity simulator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
exports = ["XlsxWriter==3.2.9", "reportlab==4.4.9"]
test = ["openpyxl>=3.1,<4", "pypdf>=5,<7"]

[project.scripts]
acquisition-sim = "financing.cli:main"

[tool.setuptools.packages.find]
include = ["financing*"]

[tool.setuptools.package-data]
financing = ["*.mjs", "*.json", "*.css", "*.js"]
